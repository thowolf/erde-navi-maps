# Offline-Kartenpakete für Erde Navi: einmal im Monat aus der Protomaps-Weltkarte (OpenStreetMap) ausschneiden
# und als Release „latest“ ablegen – pro Land bzw. deutschem Bundesland eine PMTiles-Datei, dazu Kartenstil,
# Schriften und Symbole (hilfsdateien.zip) und die Paketliste pakete.json, die Erde Navi liest.
# Dazu pro Region Routendaten (Valhalla) und Suchdaten (Adressen, Orte, POIs) für Erde Navi ohne Internet.
name: Kartenpakete

on:
  # Neu bauen, wenn sich Regionen oder Werkzeuge ändern
  push:
    branches: [main]
    paths: ['regionen.json', 'werkzeug/**', '.github/workflows/karten.yml']
  schedule:
    - cron: '17 3 2 * *'   # am 2. jedes Monats, 03:17 UTC
  workflow_dispatch:
    inputs:
      nur:
        description: 'Nur diese Regionen (Kürzel mit Komma, z. B. ch,de-be); leer = alle'
        required: false
        default: ''
      routen:
        description: 'Auch Routendaten (Valhalla) bauen'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

concurrency:
  group: karten
  cancel-in-progress: false

jobs:
  pakete:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Werkzeug pmtiles holen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R protomaps/go-pmtiles -p '*Linux_x86_64.tar.gz' -O pmtiles.tgz
          tar xzf pmtiles.tgz pmtiles
          ./pmtiles version

      - name: Neueste Weltkarte von Protomaps finden
        id: welt
        run: |
          for i in $(seq 0 14); do
            d=$(date -u -d "-$i day" +%Y%m%d)
            if curl -sfI "https://build.protomaps.com/$d.pmtiles" >/dev/null; then
              echo "url=https://build.protomaps.com/$d.pmtiles" >> "$GITHUB_OUTPUT"
              echo "stand=${d:0:4}-${d:4:2}-${d:6:2}" >> "$GITHUB_OUTPUT"
              echo "Weltkarte vom $d"
              exit 0
            fi
          done
          echo "Keine Weltkarte der letzten 14 Tage gefunden" >&2
          exit 1

      - name: Grenzen der Regionen (Natural Earth)
        run: |
          pip install --quiet shapely
          base=https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson
          curl -sfL -o laender.geojson "$base/ne_10m_admin_0_countries.geojson"
          curl -sfL -o provinzen.geojson "$base/ne_10m_admin_1_states_provinces.geojson"
          python3 werkzeug/grenzen.py laender.geojson provinzen.geojson

      - name: Regionen ausschneiden
        env:
          NUR: ${{ github.event.inputs.nur }}
          WELT: ${{ steps.welt.outputs.url }}
        run: |
          mkdir -p aus
          # Zoom bis 14 reicht zum Fahren (die Karte vergrössert darüber selbst) und halbiert etwa die Grösse
          for id in $(jq -r '.[].id' regionen.json); do
            if [ -n "$NUR" ] && [[ ",$NUR," != *",$id,"* ]]; then continue; fi
            echo "== $id"
            ./pmtiles extract "$WELT" "aus/$id.pmtiles" --region="grenzen/$id.geojson" --maxzoom=14 --download-threads=4
            ls -l "aus/$id.pmtiles"
          done
          df -h .

      - name: Platz schaffen für Such- und Routendaten
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h .

      - name: OpenStreetMap-Auszug (Geofabrik, DACH)
        run: |
          sudo apt-get install -y -qq osmium-tool > /dev/null
          curl -sfL --retry 3 -o dach.osm.pbf https://download.geofabrik.de/europe/dach-latest.osm.pbf
          ls -l dach.osm.pbf

      # ---- Suchdaten für die Suche ohne Internet (Adressen, Orte, POIs) ----
      - name: Suchdaten pro Region
        env:
          NUR: ${{ github.event.inputs.nur }}
          STAND: ${{ steps.welt.outputs.stand }}
        run: |
          pip install --quiet osmium shapely
          # Nur was die Suche braucht: Adressen, Orte, POIs (Wege behalten ihre Knoten für den Mittelpunkt)
          osmium tags-filter -O -o suche.osm.pbf dach.osm.pbf \
            nw/addr:housenumber nw/place nw/amenity nw/shop nw/tourism nw/leisure nw/historic nw/office nw/craft \
            nw/healthcare nw/sport n/railway=station,halt,tram_stop nw/aeroway=aerodrome,terminal \
            n/natural=peak,saddle,waterfall,glacier,spring,cave_entrance,volcano nw/highway=services,rest_area \
            nw/public_transport=station
          ls -l suche.osm.pbf
          python3 werkzeug/suche.py sammeln suche.osm.pbf sammlung.db
          rm suche.osm.pbf
          python3 werkzeug/suche.py regionen sammlung.db aus "$NUR"
          rm sammlung.db
          df -h .

      # ---- Routendaten für Routen ohne Internet (Valhalla, aus OpenStreetMap) ----
      # Ein Strassennetz für Schweiz, Österreich und Deutschland zusammen, damit Routen über die Grenze gehen.
      # Nur Strassen für Fahrzeuge (keine Fuss- und Velowege): halbiert die Grösse.
      - name: Strassen für die Routendaten herausfiltern
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.routen != 'false'
        run: |
          mkdir -p valhalla
          osmium tags-filter -O -o valhalla/strassen.osm.pbf dach.osm.pbf \
            w/highway=motorway,motorway_link,trunk,trunk_link,primary,primary_link,secondary,secondary_link,tertiary,tertiary_link,unclassified,residential,living_street,service,road \
            w/route=ferry,shuttle_train r/type=restriction r/boundary=administrative
          rm dach.osm.pbf
          ls -l valhalla/strassen.osm.pbf

      - name: Valhalla-Kacheln bauen
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.routen != 'false'
        run: |
          # Gleiche Valhalla-Version wie in der App (valhalla-mobile 0.6.4 = Valhalla 3.9.1)
          pip install --quiet pyvalhalla==3.9.1
          valhalla_build_config --mjolnir-tile-dir /data/kacheln --mjolnir-admin /data/admins.sqlite \
            --mjolnir-timezone /data/tz.sqlite --mjolnir-concurrency 4 > valhalla/conf.json
          docker run --rm -v "$PWD/valhalla:/data" -w /data --entrypoint bash ghcr.io/valhalla/valhalla:3.9.1 -c \
            "valhalla_build_admins -c conf.json strassen.osm.pbf && valhalla_build_tiles -c conf.json strassen.osm.pbf"
          sudo chown -R "$USER" valhalla
          du -sh valhalla/kacheln

      - name: Routendaten pro Region verpacken
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.routen != 'false'
        env:
          NUR: ${{ github.event.inputs.nur }}
        run: |
          python3 werkzeug/routen.py valhalla/kacheln aus "$NUR"
          rm -rf valhalla
          df -h .

      - name: Kartenstil, Schriften und Symbole
        run: |
          npm install --no-save --silent @protomaps/basemaps
          node werkzeug/stil.mjs aus
          git clone --depth 1 https://github.com/protomaps/basemaps-assets.git assets
          mkdir -p hilfe/fonts hilfe/sprites
          # Nur die Schriften, die der Stil braucht (Noto Sans), und die Symbole v4
          cp -r assets/fonts/Noto\ Sans\ * hilfe/fonts/
          cp assets/sprites/v4/light* assets/sprites/v4/dark* hilfe/sprites/
          cp aus/stil-light.json aus/stil-dark.json hilfe/
          (cd hilfe && zip -qr ../aus/hilfsdateien.zip .)
          ls -l aus/hilfsdateien.zip

      - name: Paketliste
        run: node werkzeug/liste.mjs aus "${{ steps.welt.outputs.stand }}" "${{ steps.welt.outputs.url }}"

      - name: Release „latest“ ersetzen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          shopt -s nullglob
          gh release create latest aus/*.pmtiles aus/*.routen.tar.gz aus/*.suche.gz aus/hilfsdateien.zip aus/pakete.json \
            --title "Kartenpakete ${{ steps.welt.outputs.stand }}" \
            --notes "Offline-Karten für Erde Navi, Datenstand ${{ steps.welt.outputs.stand }}. Kartendaten © OpenStreetMap-Mitwirkende (ODbL), Kacheln Protomaps, Routendaten Valhalla, Suchdaten aus OpenStreetMap. Liste: pakete.json"
